name: Auto Backup DB Schema

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dump Remote Database Schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p supabase/migrations
          docker run --rm -v \({{ github.workspace }}:/workspace -w /workspace postgres:17-alpine sh -c "pg_dump '\)SUPABASE_DB_URL' --schema-only --no-owner --no-acl -f supabase/migrations/esquema_actualizado.sql && chown -R \((id -u):\)(id -g) supabase/migrations"

      - name: Verify generated file
        run: |
          ls -la supabase/migrations/esquema_actualizado.sql

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update database schema backup"
          file_pattern: "supabase/migrations/esquema_actualizado.sql"
