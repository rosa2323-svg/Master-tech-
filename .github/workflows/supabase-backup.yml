name: Auto Backup DB Schema

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump Remote Database Schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p supabase/migrations
          # Usamos un comando directo de postgres para volcar el esquema usando la URI completa
          pg_dump "$SUPABASE_DB_URL" --schema-only --no-owner --no-acl -f supabase/migrations/esquema_actualizado.sql

      - name: Commit and Push changes if schema changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-backup database schema from Supabase"
          file_pattern: "supabase/migrations/*.sql"
