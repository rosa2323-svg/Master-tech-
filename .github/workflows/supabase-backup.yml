name: Supabase Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create Database Backup
        run: |
          mkdir -p backups
          pg_dump "\({{ secrets.SUPABASE_ACCESS_TOKEN }}" -F c -b -v -f "backups/backup_\)(date +'%Y%m%d_%H%M%S').dump"

      - name: Commit and push backup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated database backup: $(date +'%Y-%m-%d')" && git push)
